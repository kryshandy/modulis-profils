{% load i18n %}{# Image slot of a block: img.slot, img.label, img.name, img.current (BlockImage), img.error #}
<div class="form-field blockimg{% if img.error %} form-field--error{% endif %}">
  <p class="form-field__label">{{ img.label }}</p>
  {% if img.current %}
    <img class="blockimg__preview" src="{{ img.current.image.url }}" alt="" width="{{ img.current.width }}" height="{{ img.current.height }}" loading="lazy">
    <label class="check"><input type="checkbox" name="del_{{ img.slot }}" value="1"> <span>{% translate "Retirer cette image" %}</span></label>
  {% endif %}
  <label class="blockimg__drop">
    <span>{% if img.current %}{% translate "Remplacer l'image" %}{% else %}{% translate "Choisir une image" %}{% endif %}</span>
    <input class="visually-hidden-input" type="file" name="{{ img.name }}" accept="image/*" data-files-label>
  </label>
  <p class="small" data-files-output aria-live="polite"></p>
  {% if img.error %}<p class="form-field__error" role="alert">{{ img.error }}</p>{% endif %}
</div>
