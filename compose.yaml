# Environnement de développement. Lancer depuis WSL Ubuntu : make up
name: modulis-profils

x-django: &django
  build:
    context: .
    dockerfile: docker/django/Dockerfile
    target: dev
  env_file: .env
  volumes:
    - .:/app
    - media:/app/media
    # Backup folder of the host, read-only: the admin index shows the last backup (BACKUP_STATUS_DIR).
    - ${BACKUP_DIR:-./backups}:/backups:ro
  environment: &django-env
    BACKUP_STATUS_DIR: /backups
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    <<: *django
    environment:
      <<: *django-env
      RUN_MIGRATIONS: "1"
    ports:
      - "${WEB_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *django
    command: ["python", "manage.py", "run_huey_dev"]  # auto-reload in dev (prod uses run_huey)

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: modulis_profils
      POSTGRES_USER: modulis
      POSTGRES_PASSWORD: modulis
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host port 5433 by default: 5432 is often taken by a local PostgreSQL (containers still use db:5432).
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modulis -d modulis_profils"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Sauvegardes HORS de Docker (docs/SAUVEGARDES.md) : base + médias écrits dans un dossier de l'hôte
  # (BACKUP_DIR, par défaut ./backups). Ils survivent à `docker compose down -v`, aux reconstructions
  # d'images, au nettoyage des volumes et à la réinstallation de Docker.
  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      PGHOST: db
      PGUSER: modulis
      PGPASSWORD: modulis
      PGDATABASE: modulis_profils
      BACKUP_HOST_DIR: ${BACKUP_DIR:-./backups}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - media:/media
      # Off-site copy (optional): rclone configuration of the host, read-only.
      - ${RCLONE_CONFIG_DIR:-./docker/backup/rclone}:/root/.config/rclone:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  media:
