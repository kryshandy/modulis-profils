# Environnement de production (Gunicorn + Nginx + PostgreSQL 17 + Redis 7 + sauvegardes).
# Usage : docker compose -f compose.prod.yaml up -d --build
name: modulis-profils

x-django-prod: &django-prod
  build:
    context: .
    dockerfile: docker/django/Dockerfile
    target: prod
  env_file: .env
  environment: &django-prod-env
    DJANGO_SETTINGS_MODULE: config.settings.prod
    BACKUP_STATUS_DIR: /backups
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/var/www/static:ro
      - media:/var/www/media:ro
      - ${NGINX_CERTS_DIR:-./docker/nginx/certs}:/etc/nginx/certs:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    <<: *django-prod
    environment:
      <<: *django-prod-env
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-0}"
    command:
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "${GUNICORN_WORKERS:-3}"
      - --timeout
      - "30"
      - --access-logfile
      - "-"
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles
      - ${BACKUP_DIR:-/srv/sauvegardes/modulis}:/backups:ro
    networks:
      - frontend
      - backend
      - egress
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    <<: *django-prod
    command: ["python", "manage.py", "run_huey"]
    volumes:
      - media:/app/media
    networks:
      - backend
      - egress
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import pathlib, sys; sys.exit(0 if any('run_huey' in p.read_text(errors='ignore') for p in pathlib.Path('/proc').glob('[0-9]*/cmdline')) else 1)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:17-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-modulis_profils}
      POSTGRES_USER: ${POSTGRES_USER:-modulis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-modulis} -d ${POSTGRES_DB:-modulis_profils}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    env_file: .env
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-modulis}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      PGDATABASE: ${POSTGRES_DB:-modulis_profils}
      BACKUP_HOST_DIR: ${BACKUP_DIR:-/srv/sauvegardes/modulis}
      BACKUP_REQUIRE_ENCRYPTION: "1"
    volumes:
      - ${BACKUP_DIR:-/srv/sauvegardes/modulis}:/backups
      - media:/media
      - ${RCLONE_CONFIG_DIR:-./docker/backup/rclone}:/root/.config/rclone:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - egress
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/backup-healthcheck.sh"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 10m

volumes:
  pgdata:
  redisdata:
  media:
  staticfiles:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  egress:
    driver: bridge
