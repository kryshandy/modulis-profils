{% if services %}
<section class="t-section t-section--services" id="prestations">
  <div class="t-wrap t-section__inner">
    <h2 class="t-h2">{{ label }}</h2>
    <ul class="services t-services">
      {% for s in services %}
      <li class="service t-service">
        <div class="t-service__head"><h3 class="service__title t-service__title">{{ s.title }}</h3>{% if s.price_label %}<span class="service__price t-price">{{ s.price_label }}</span>{% endif %}</div>
        {% if s.description %}<p class="service__desc t-service__desc">{{ s.description }}</p>{% endif %}
      </li>
      {% endfor %}
    </ul>
  </div>
</section>
{% endif %}
