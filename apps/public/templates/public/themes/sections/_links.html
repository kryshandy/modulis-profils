{% if links %}
<section class="t-section t-section--links" id="liens" aria-labelledby="t-h-links">
  <div class="t-wrap t-section__inner">
    <header class="t-sec-head" data-reveal><span class="t-index" aria-hidden="true"></span><h2 class="t-h2" id="t-h-links">{{ label }}</h2></header>
    <div class="t-sec-body">
      <ul class="links t-links" data-reveal>
        {% for l in links %}<li><a href="{{ l.url }}" rel="{{ user_link_rel }}" data-track="link"><span>{{ l.label }}</span><span class="t-arrow" aria-hidden="true">↗</span></a></li>{% endfor %}
      </ul>
    </div>
  </div>
</section>
{% endif %}
