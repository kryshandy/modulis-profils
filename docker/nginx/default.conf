upstream django_web {
    server web:8000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Healthcheck interne Docker (reste actif même quand HTTP redirige vers HTTPS)
    location = /nginx-healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Défi ACME (Let's Encrypt / certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # En production avec certificats TLS locaux, décommenter la redirection ci-dessous
    # et commenter les blocs location /static/, /media/ et / ci-après :
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # En-têtes de sécurité globaux
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Fichiers statiques servis directement par Nginx
    location /static/ {
        alias /var/www/static/;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Médias utilisateurs servis directement (nosniff obligatoire : jamais d'exécution)
    location /media/ {
        alias /var/www/media/;
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }

    # Proxy vers Gunicorn (web:8000)
    location / {
        proxy_pass http://django_web;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}

